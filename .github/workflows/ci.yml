name: CI

# Push to main validates the trunk post-merge; PRs validate proposed changes.
# Feature-branch pushes do NOT trigger a run on their own — they are covered by
# the PR's `pull_request` run. This avoids the previous double-run, where a
# `push` run and a `pull_request` run fired for the same commit and raced for
# the limited macos-26 runner pool, leaving one of them cancelled.
# No code signing — unit + library tests only.
#
# A `v*` TAG RUNS THE TESTS AND NOTHING ELSE. This repository ships a paid app
# through the App Store, so it publishes no release artefacts: a tag is
# metadata that records which commit a version was built from, and the only
# thing it should produce is public evidence that the tree at that commit
# passes. `release.yml` deliberately does NOT trigger on tags for the same
# reason — see the note at its own `on:` block.
#
# The concurrency group below keys on `ref_name`, which for a tag is the tag
# itself, so a tag run and a `main` run never cancel each other.

on:
  push:
    branches: [main]
    tags: ['v*']
  # EVERY PULL REQUEST, NOT ONLY THE ONES TARGETING main.
  #
  # This carried `branches: [main]`, which means a pull request based on
  # another branch got NO run at all -- and GitHub then reports that PR as
  # `CLEAN`, because a PR with no checks has no failing checks. Measured
  # 2026-09-10 on two stacked pull requests: `gh run list --branch <head>`
  # returned nothing for either, while `gh pr view` called both mergeable.
  #
  # An absent check reads exactly like a passing one to anything that scans
  # for failures, which is the whole reason this filter is a defect rather
  # than a preference. Stacking is how the work arrives here -- a chain four
  # deep was open when this was found -- so the shape that gets no coverage
  # is the shape most of the queue is in, and the coverage arrives only after
  # the base merges and the PR is retargeted at main. That is the wrong order:
  # the point of the gate is to know BEFORE merging.
  #
  # The cost is bounded. A pull request gets one run either way; this changes
  # which pull requests get one, not how many runs each gets, and the
  # concurrency group below still cancels superseded runs per head branch.
  pull_request:

# Cancel an in-progress run when a newer commit supersedes it: keyed per source
# branch for PRs (head_ref), per ref for main pushes (ref_name).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, stated here rather than inherited from the repository's default
# workflow permission, so the grant is decided by this reviewed file and not by
# a setting nobody sees change (#283). Nothing here needs more: uploads and
# caches do not use the contents scope for writing.
permissions:
  contents: read

jobs:
  # THE SCRIPTS IN scripts/ HAD NO GATE AT ALL, and the pipeline is
  # steered by them. `am-ledger list pr` returned 90 rows, 2 of them at
  # stage `pr`, and a decision was taken on that listing and later
  # retracted -- a filter that read the wrong thing and returned a
  # screenful of plausible rows rather than an error.
  #
  # ubuntu-latest and no toolchain: this must be cheap enough that
  # nobody is tempted to make it conditional. It does not touch the real
  # ledger -- each test points AM_LEDGER_DIR at a temporary directory.
  #
  # The loop lives in scripts/test-scripts.sh: a non-zero exit, a script
  # that stops before its summary line and a glob under the floor each fail
  # the step and are named — a step whose result nothing reads is the
  # defect this job exists for.
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    # Seven seconds in practice. Five minutes is a hang, not a slow runner —
    # and an unbounded ubuntu job is cheap enough to be forgotten for hours.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-fs-core's agents-core check runs in place from this checkout
      # (scripts/tests/agents-core-check.sh); this repository keeps no copy.
      # The tag is the release whose check reads the guide of the repository
      # it is run for.
      - name: rust-fs-core, beside this checkout
        run: git clone --quiet --depth 1 --branch v0.3.3 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - name: Semantics the Xcode job cannot reach
        # The loop, the `<name>: all checks passed` contract and the floor
        # live in scripts/test-scripts.sh, which `chore check:scripts` runs
        # too, so a guard that passes there passes here. Quiet: a pass prints
        # the verdict and the count, a failure names each failing script and
        # its FAIL lines, and every script's output is in the uploaded log.
        run: bash scripts/test-scripts.sh

      # KEEP THE LOG, GREEN OR RED. The tier prints a verdict; the whole run
      # is in tmp/logs/, and a log nothing uploads is a log nobody can read
      # once the runner is gone (#211).
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-scripts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/logs/
            !tmp/logs/*.xcresult
          retention-days: 7
          if-no-files-found: warn

  # THE FAST GATE, AND THE ONE THAT DOES NOT DEPEND ON AN APP LAUNCH.
  #
  # DiskJockeyLibraryTests is host-free: every file is
  # `@testable import DiskJockeyLibrary`. The app-hosted bundle beside it
  # (TEST_HOST = DiskJockey.app) is what costs — measured 2026-09-10 from
  # xcodebuild's own `IDETestOperationsObserverDebug: N elapsed`, getting that
  # host up took 22.8s on a run that finished in 1m52s, 838s and 849s on runs
  # that took 17 minutes, and 367s on the runs where it gave up and reported
  # "The test runner timed out while preparing to run tests". The tests are not
  # slow: every suite reports in hundredths of a second.
  #
  # So this job answers "did the library break" in seconds, with no app, no
  # seven FSKit extensions, no File Provider and nothing to launch. It runs
  # BESIDE `Build & Test` rather than replacing it, because the app-hosted
  # suites cover real behaviour and losing them would be the trade I already
  # got wrong once today.
  library-tests:
    name: Library tests
    runs-on: macos-26
    # Measured locally on 2026-09-10: 11 seconds cold from an empty build
    # directory, of which 0.4s is the testing. 10 minutes is a hang, not a
    # slow runner, and the step bound below is what says which step it was.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same auto-select as the `test` job: the image's default Xcode is not
      # necessarily the newest installed, and Package.swift needs a Swift 6
      # toolchain to read `swift-tools-version: 6.0`.
      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      # NO RUST, NO GO, NO SIBLINGS, NO CACHES, NOTHING TO SIGN AND NOTHING
      # TO LAUNCH.
      #
      # This job was first written as `xcodebuild test -scheme
      # DiskJockeyLibraryOnly`, on the theory that a scheme with no app in it
      # would avoid the launch. It did not, and the run that proved it is the
      # reason this step reads `swift test` instead:
      #
      #     Could not launch "DiskJockeyLibraryTests".
      #     Runningboard has returned error 5
      #       (Underlying Error: Launchd job spawn failed)
      #
      # An .xctest bundle is a dylib and needs a process to host it. With
      # TEST_HOST set that host is DiskJockey.app; without it xcodebuild
      # substitutes its own `xctest` runner and launches THAT through
      # RunningBoard. The launch belongs to xcodebuild, not to the app, so no
      # arrangement of schemes or signing flags removes it. `swift test` links
      # the test code into a binary and runs it — there is no runner to spawn
      # and nothing for RunningBoard to refuse. See Package.swift's header and
      # diskjockey#139.
      - name: Test the library with no host
        # 6 against a measured 11 seconds. Wide because a cold runner has to
        # fetch nothing but still compiles 35 files from scratch.
        timeout-minutes: 6
        # `swift test` through scripts/test-library.sh, which `chore
        # test:library` runs too: quiet, held to a measured budget, with the
        # executed-case floor beside it.
        run: bash scripts/test-library.sh

      - name: Name what failed
        if: failure()
        run: grep -aE 'error:|✘|failed' tmp/logs/library.log | head -80 || true

      # KEEP THE LOG, GREEN OR RED. The tier prints a verdict; the whole run
      # is in tmp/logs/, and a log nothing uploads is a log nobody can read
      # once the runner is gone (#211).
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/logs/
            !tmp/logs/*.xcresult
          retention-days: 7
          if-no-files-found: warn

  test:
    name: Build & Test
    # macos-26 is the Apple Silicon runner for macOS 26.
    # Fall back to macos-15 if the runner isn't available in your plan yet.
    runs-on: macos-26
    # THE STEP BOUND IS NOT A JOB BOUND, and this is what that costs.
    # `Test` has carried timeout-minutes: 25 since #117, chosen because that
    # step was the one observed hanging. On 2026-09-10 a post-merge run on
    # main hung in **Set up Go** — step 8 of 25, long before Test — and ran
    # for TWO HOURS before a person noticed and cancelled it, holding the
    # only macos-26 runner in the pool while the pull requests waiting to
    # merge got no runner at all.
    #
    # 40 rather than 25: the job is the sum of its steps, and the slowest
    # good run measured so far is 16.8 minutes of Test plus the setup and
    # cache steps around it. This is the ceiling that stops a hang billing
    # macOS minutes for six hours; the per-step bound stays where it is,
    # because a bound that fires tells you which step it was.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, and needs nothing but the checkout -- no network, no
      # toolchain. A stale transitive pin can sit for a long time
      # otherwise: am-fs-core sat six releases behind for eight
      # releases, missing a silent-wrong-bytes fix, because a lockfile
      # can be internally self-consistent and still not use a version
      # anyone has actually verified. See diskjockey#90 and the
      # script's own header for why this is not the same check as the
      # pre-commit hook's `cargo metadata --locked`.
      - name: Check bundle dependency floor
        run: scripts/check-bundle-floors.sh

      # The siblings are checkouts beside this repository now, not
      # submodules. Cloned at the ref SIBLING_PINS.txt names, so CI builds
      # what the pin says rather than whatever a developer has locally.
      # A fresh clone is clean and on the pinned ref, so the build takes
      # it as-is.
      # chore owns the sibling builds now, so CI needs it. Installed from
      # the release archive rather than the Homebrew tap: `brew install`
      # on a macOS runner costs a minute or more of tap update, and this
      # is one binary.
      - name: Install chore
        shell: bash
        run: |
          ver=$(awk '$1=="chore"{print $2}' SIBLING_PINS.txt)
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v${ver}/chore-${ver}-darwin-arm64.tar.gz" \
            | tar -xz -C /usr/local/bin chore
          chore --version

      - name: Clone sibling projects
        shell: bash
        run: |
          ref=$(awk '$1=="go-networkfs"{print $2}' SIBLING_PINS.txt)
          git clone --depth 1 --branch "$ref" \
            https://github.com/christhomas/go-networkfs.git ../go-networkfs

      # Auto-select the newest installed Xcode on the runner.
      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up Rust (aarch64)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable


      # lib/ output is keyed on what now determines it: the bundle
      # manifests, which name the published crate versions, and the
      # sibling pins. VENDOR_PINS.txt is gone with the submodules.
      - name: Restore library cache
        id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib/
          key: lib-${{ runner.os }}-${{ hashFiles('SIBLING_PINS.txt', 'rust-bundles/**/Cargo.toml', 'rust-bundles/**/Cargo.lock') }}

      # Only restore intermediate Rust artifacts on a vendor cache miss
      # so the next miss still benefits from incremental compilation.
      - name: Restore Cargo cache
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-bundles/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build libraries
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        # vendor-bundles builds the per-extension aggregator staticlibs
        # (lib/bundle_<fs>/) and their C headers, which the FSKit extension
        # targets include via HEADER_SEARCH_PATHS. Without it the Xcode build
        # fails with "'fs_<fs>.h' file not found".
        run: make vendor-gonetworkfs vendor-bundles


      - name: Install xcbeautify
        run: brew install xcbeautify

      # UI tests are excluded — they require a running app and virtual display.
      - name: Test
        # A BOUND ON THE STEP, NOT ON THE JOB, and the difference is the
        # whole point. This job also carries `Build libraries`, which is
        # skipped on a vendor-cache hit and unmeasured on a miss — a
        # bound big enough to be safe for a cold cache is too big to
        # catch this step hanging.
        #
        # WHAT IT DOES AND DOES NOT DO. It caps the bill. It does not
        # diagnose the hang: one run held a macos runner for 67m39s on a
        # docs-only diff and went green, and what it was doing for the
        # extra hour is not established. Without a bound the ceiling is
        # GitHub's default of 360 minutes, at 10x macOS billing.
        #
        # 25 against an observed 8-12 minute range: wide enough that a
        # slow runner or a cold Xcode does not fail a good build, narrow
        # enough that a hang is caught inside the hour it used to burn.
        timeout-minutes: 25
        # xcodebuild through scripts/test-app.sh, which `chore test:app` runs
        # too: the raw stream to tmp/logs/app.log, held to a measured budget,
        # then the case count and verdict from the result bundle it writes to
        # tmp/logs/app.xcresult. Why only DiskJockeyTests, why unsigned, and
        # why the count comes from the bundle are all recorded in the script.
        run: bash scripts/test-app.sh

      # THE ANNOTATIONS, ON THE RUNS THAT NEED THEM. The run is quiet, so
      # xcbeautify no longer stands between it and the log; on a failure it
      # renders the kept raw log once, warnings and errors only, into the annotations a
      # reviewer reads first.
      - name: Name what failed
        if: failure()
        run: xcbeautify --renderer github-actions --quiet < tmp/logs/app.log || true

      # THE DIAGNOSTIC THIS DEFECT HAS BEEN MISSING. #139 has been diagnosed
      # from beautified stdout all day, which is why nobody can say WHY the
      # app-hosted bundle fails to launch: `xcodebuild` says only
      # "The test runner timed out while preparing to run tests", and the
      # .xcresult that holds the launch error was discarded at the end of every
      # run. Keep it, and the next stall names its own cause.
      - name: Keep the result bundle when the suite fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/logs/app.xcresult
          retention-days: 7
          if-no-files-found: warn

      # KEEP THE LOG, GREEN OR RED. The tier prints a verdict; the whole run
      # is in tmp/logs/, and a log nothing uploads is a log nobody can read
      # once the runner is gone (#211).
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/logs/
            !tmp/logs/*.xcresult
          retention-days: 7
          if-no-files-found: warn

  # An aggregate result is stable when a leg is renamed or split. Keep the
  # three legs required too: this job's verdict is a claim about their work.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [scripts, library-tests, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every needed result
        env:
          NEEDED_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/check-ci-results.sh "$NEEDED_RESULTS"
