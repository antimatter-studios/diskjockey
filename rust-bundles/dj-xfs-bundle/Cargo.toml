# Consumer-side aggregator for the DiskJockeyXFS FSKit extension.
# Depends on the PUBLISHED crates.io releases rather than local paths, so
# every crate's rust-fs-core resolves to one published rust-fs-core and cargo
# links a single std. Two copies of std in one staticlib produce a
# duplicate _rust_eh_personality at link time.
# Not published itself.
[package]
name = "dj-xfs-bundle"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "dj_xfs_bundle"
crate-type = ["staticlib"]

[dependencies]
rust-fs-xfs = "0.12.0"
rust-img-qcow2 = "0.6.0"
rust-img-vhd = "0.6.0"
rust-img-vhdx = "0.6.0"
rust-img-vmdk = "0.5.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"
