# Consumer-side aggregator for the DiskJockeyEROFS FSKit extension.
# Depends on the PUBLISHED, proven crates.io releases (not local paths), so
# every crate's rust-fs-core resolves to one published rust-fs-core and cargo
# links a single std. Leaf crates are unchanged (ntfs keeps its vendored
# rust-fs-core). Not published itself.
[package]
name = "dj-erofs-bundle"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "dj_erofs_bundle"
crate-type = ["staticlib"]

[dependencies]
rust-fs-erofs = "0.4.0"
rust-img-qcow2 = "0.6.0"
rust-img-vhd = "0.6.0"
rust-img-vhdx = "0.6.0"
rust-img-vmdk = "0.5.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"
