version: "3"
chore_min_version: 0.6.0

# THE TEST TIERS AND THEIR OUTPUT BUDGETS (#211).
#
# Three tiers, one script each, and CI's three jobs run the same scripts:
# `Shell scripts` runs test-scripts.sh, `Library tests` test-library.sh,
# `Build & Test` test-app.sh. Each runs its suite through scripts/quiet-run.sh
# (this repository's own wrapper, not the family's): the whole raw run goes to
# tmp/logs/<tier>.log, a pass prints a verdict naming that log plus the
# executed count against its floor, a failure prints the verdict, the exit
# status and the log path with no tail, and a pass whose LOG outgrew its
# budget exits 65. `-- --verbose` streams the run and is held to the same
# budget. CI uploads tmp/logs/ on every run, green or red.
#
# The budget caps the log, not what was shown. A tier that legitimately grows
# raises its row here AND in its script, with the measurement that justifies
# it; scripts/tests/test-tiers.sh fails when the two disagree.
#
# Measured from CI, which is always cold — no DerivedData, no .build — and
# prints the most: a warm local run is quieter (library: 632 lines against
# CI's 994). Run 36614133886, 2026-09-29, the first with these tiers. Headroom
# is about a quarter over the measurement, and each row says what it is:
#
#   tier      lines    bytes   measured (lines / bytes)     headroom   floor
#   scripts    1270    65700   1,009 / 52,514 (79 files)    26% / 25%  82 files
#   library    4510   350000   3,548 / 274,815              27% / 27%  715 cases
#   app        5200   950000   4,119 / 750,848 (raw)        26% / 27%  90 cases
#   cli-pipe    270    16200   213 / 12,909 (Linux)         27% / 25%  25 macOS, 37 Linux
# Floors measured locally 2026-10-07 for #320: 43 script files and
# 577 library cases (65 XCTest + 512 swift-testing). Budgets are unchanged.
# The XFS v5 release-runner contract raises the scripts floor to 44 (#325).
# The CLI capability executor guard (#401), together with the CI dispatch
# guard (#405) and DriverKit mount-contract guard (#392), brings the measured
# glob to 50 files on 2026-10-18. Its separate executor starts with a
# 200-line / 30,000-byte ceiling for 84 driver/operation cells plus preflight
# diagnostics; #403 will record the released-tool workflow measurement.
# The DriverKit mount-contract guard (#392) raises the tracked script-file
# inventory and floor from 49 to 50 on 2026-10-18; execution is left to CI.
# The scripts row is measured again for #411: main's run 39094316044
# (2026-10-18) printed 801 lines / 41,786 bytes for 49 files against the
# 810 / 42,600 budget. With the DriverKit guard and the CLI exit-status guard
# the tier is 51 files, floor 51, measured locally the same day at
# 819 / 42,583, so the budget rises 25% over that.
# Main's run 39918549371 (2026-10-23) printed 1,009 lines / 52,514 bytes
# for 79 files against 1,030 / 53,300, leaving less than the btrfs seed
# guard (#492) prints, so the budget rises about 25% over that measurement.
# The DriverKit service target guard (#393) raises the inventory floor to 52;
# its two verdict lines fit the existing measured output headroom.
# The reader-boundary guard (#418) and host VHDX ABI guard (#424) raise it to 54.
# The C11/C++17 read wire contract (#428) raises the inventory floor to 55;
# its three verdict lines fit the unchanged output budget.
# The pending-read lifecycle (#429) raises the inventory floor to 56;
# its two verdict lines fit the unchanged output budget.
# The agent serve loop (#443) raises the tracked inventory to 59 files.
# The owned attachment lifecycle (#447) raises it to 60 within the same budget.
# The agent media correlation guard (#451) raises it to 61 within the same budget.
# The agent bridge authorization guard (#456) raises it to 62 within the same budget.
# The dext mount-selector guard (#460) raises it to 63 within the same budget.
# The dext block-I/O guard (#461) raises it to 64 within the same budget.
# The agent bridge mount-selector guard (#458) raises it to 65 within the same budget.
# The trusted XPC connection ownership guard (#453) raises the inventory floor to 66.
# The owned DriverKit XPC guard (#454) raises it to 67; the retained image
# eject route guard (#480) raises it to 68. The library floor rises from
# 696 to 705 with nine source-counted eject cases; execution stays in CI.
# The agent-side qcow2 reader guard (#395) and the agent media identity guard
# (#506) raise it to 70 within the same budget.
# The activation prompt cases (#475) raise the library floor from 705 to
# 715, counted from the source; execution stays in CI.
# The XFS writable-policy gate raises the library floor to 593 (#321),
# measured locally 2026-10-07: 65 XCTest + 528 swift-testing, all passed.
# The bcachefs volume raises the library floor to 663 (#342), measured
# locally 2026-10-12: 65 XCTest + 598 swift-testing, all passed, in 1,656
# lines / 124,829 bytes, and the app floor to 90 with its five bcachefs probe
# and event cases (1,586 lines / 210,280 bytes). The library row is then
# measured again on CI with the bcachefs suites (run 38300220670, 2026-10-12):
# 2,779 lines / 214,287 bytes, over the 2,750 / 212,000 budget, and 668 cases
# (65 XCTest + 603 swift-testing), so its budget rises to 3,530 / 272,200 and
# its floor to 668.
# The DriverKit stack through #534 measured 3,548 lines / 274,815 bytes on
# CI run 39210982857 (2026-10-19), above the library ceiling. The measured
# output is retained; the budget rises to 4,510 / 350,000 with 27% headroom.
#
# cli-pipe is not a fourth tier: it installs other repositories' releases and
# runs in its own scheduled workflow, not in `chore test` (#292). Its row is
# here because it runs through the same wrapper and is held to a budget the
# same way; measured on run 37073259858, 2026-10-02, all 17 pipelines green.
# #296 raised its floor to 25 pipelines on macOS and 37 on Linux, with the
# ext4, XFS and Btrfs legs. The row was raised from 130 / 8,400 on macOS's
# first green run with them, run 37138277392, 2026-10-03: 152 lines / 9,252
# bytes, every check passed, exit 65 only for the budget. Linux, which runs
# more pipelines, then had its first green run, run 37146995541, 2026-10-03:
# 213 lines / 12,909 bytes, every check passed, exit 65 only for the budget.
# Both legs share this row, so it is set from the larger, Linux.
#
# The library row has already moved four times, and that is the budget working:
# 994 lines on run 36614133886, then 1,204 on run 36619808267 after #241 —
# four more cases, but 62 compiler warnings against 28, each printed with its
# source context (34 of the new ones are one non-Sendable conversion in
# RawDisksModel and its tests) — then 1,355 on run 36621524031 after #243,
# with 69, then 1,710 on run 36658298559 after #251 — sixteen more tests,
# one of them over seven arguments, and no new warnings, so pure growth —
# then 2,168 on run 36706960213 once the volume mirrors began leaving for
# the library suite (#196), 452 cases and no new warnings, pure growth again.
# Raised with each measurement rather than silenced; the warnings
# are the thing to fix, and fixing them gives this headroom back. The scripts tier grows by
# about 18 lines per new guard, so its row moves with the suite. The app tier's log is the RAW xcodebuild stream, which is
# why it is five times the others; the job itself printed 520 lines, against
# 1,343 before these tiers.

# WHAT THIS FILE IS FOR, AND WHAT IT IS NOT.
#
# diskjockey is the controller: it orchestrates the twelve library
# repositories rather than being one of them, so it has no `staticlib` and no
# `artifact` — the two tasks every sibling exposes. What it does have is
# oversight, and that is what lives here.
#
# The tasks are thin on purpose. Each one names a script in scripts/ and
# nothing else: the knowledge of HOW to answer a question belongs in the
# script, which is testable, reviewable and runnable without chore at all.
# A task that grows a pipeline of its own is a task nobody can test.

tasks:
  overview:summary:
    desc: Counts only — one row per project, no issue detail
    cmds:
      - scripts/am-overview --summary

  overview:list:
    desc: Every project in turn, each with its issue numbers and titles
    # NO `sources`, DELIBERATELY. Freshness here is not a property of any
    # file in this repository — the answer lives on GitHub and changes when
    # somebody files an issue. A `sources` list would let chore report this
    # task as up to date while the backlog moved underneath it, which is the
    # exact shape of defect the pipeline spends its time filing: a check
    # whose output does not depend on what it is meant to detect.
    cmds:
      - scripts/am-overview --list

  overview:tsv:
    desc: The detail rows as TSV, for piping somewhere else
    cmds:
      - scripts/am-overview --tsv

  audit:family-scripts:
    desc: Every Rust crate runs the family scripts from rust-fs-core and keeps no copy
    # Reads each default branch on GitHub, so no `sources` for the same reason
    # as overview:list. Exit 1 names the projects that still carry a copy.
    cmds:
      - scripts/am-family-scripts

  pr:list:
    desc: Every pull request across the constellation (add -- --state open, --tsv, ...)
    # No `sources`, for the same reason as overview:list: the answer is on GitHub.
    cmds:
      - scripts/am-prs {{.CLI_ARGS}}

  pr:external:
    desc: Pull requests opened by external contributors (add -- --state open, --tsv, ...)
    cmds:
      - scripts/am-prs --external {{.CLI_ARGS}}

  issue:list:
    desc: Every open issue across the constellation, oldest first, as JSON (add -- --unclaimed, --urls, --prs, --no-cache, ...)
    # No `sources`, for the same reason as overview:list: the answer is on
    # GitHub. scripts/am-issues keeps each repository's answer itself, under
    # the XDG cache directory, for AM_GITHUB_CACHE_TTL seconds (600).
    cmds:
      - scripts/am-issues {{.CLI_ARGS}}

  branch:reap:
    desc: The branches of merged pull requests nothing needs, across the constellation (add -- --apply to delete)
    # No `sources`: the answer is on GitHub, and moves with every merge.
    cmds:
      - scripts/am-branch-reap {{.CLI_ARGS}}

  check:scripts:
    desc: The scripts tier — every scripts/tests/*.sh guard, quietly (-- --verbose to stream)
    # The same script the `Shell scripts` CI job runs, so a guard that passes
    # here passes there. It refuses a failing script, one that stops before
    # its `<name>: all checks passed` line, and a glob under its floor.
    cmds:
      - scripts/test-scripts.sh {{.CLI_ARGS}}

  test:library:
    desc: The library tier — DiskJockeyLibraryTests through swift test, host-free, quietly
    # The same script the `Library tests` CI job runs, floor included.
    cmds:
      - scripts/test-library.sh {{.CLI_ARGS}}

  fixtures:bcachefs:
    desc: Refresh the bcachefs images the library tier reads, from rust-fs-bcachefs CI's reference-tool fixtures (-- RUN_ID)
    # The images are committed under DiskJockeyBCACHEFSCoreTests/Fixtures with
    # their provenance; this is the task a test that cannot find one names.
    cmds:
      - scripts/bcachefs-fixtures.sh {{.CLI_ARGS}}

  test:app:
    desc: The app tier — DiskJockeyTests through xcodebuild, quietly (needs make vendor-all and a GUI session)
    # The same script the `Build & Test` CI job runs, floor and bundle verdict
    # included. -- --verbose streams through xcbeautify when it is installed.
    cmds:
      - scripts/test-app.sh {{.CLI_ARGS}}

  test:
    desc: All three tiers, cheapest first — scripts, library, app
    # NO `sources`, and no fingerprint to skip on: a test run that reports
    # "up to date" without running is the absence every floor here exists to
    # refuse.
    cmds:
      - scripts/test-scripts.sh {{.CLI_ARGS}}
      - scripts/test-library.sh {{.CLI_ARGS}}
      - scripts/test-app.sh {{.CLI_ARGS}}

  test:cli-pipe:
    desc: The released drivers' tools compose — blk.probe -> fs.<fs> --offset, img.<fmt> read, fs.<a> read | fs.<b> write
    # Not one of the three tiers and not part of `chore test`: it installs
    # other repositories' latest releases, so its answer moves when they
    # release, and the CLI pipe workflow runs it on a schedule rather than on
    # every pull request. No `sources`, for the same reason as overview:list.
    # -- --no-install tests whatever is already on PATH (a Homebrew install).
    cmds:
      - scripts/cli-pipe.sh {{.CLI_ARGS}}

  test:xfs-v5-release:
    desc: Signed macOS XFS v5 release validation — requires reviewed fixtures and Linux oracle evidence
    # Separate from unsigned PR tiers. See docs/xfs-v5-release-validation.md.
    # No sources/fingerprint: every release run must mount and validate again.
    cmds:
      - scripts/test-xfs-v5-release.sh {{.CLI_ARGS}}

  test:xfs-mutations:
    desc: The production XFS volume over the vendored bundle, driven through FSKit against a Linux-made image
    # Not one of the three tiers: the image comes from test:xfs-mutations-vm
    # `create`, and its `verify` (xfs_repair -n, xfs_logprint, xfs_db and the
    # kernel) is the independent half. Needs the XFS bundle
    # (scripts/build-bundles.sh xfs). Arguments: <image> <expected-dir>. The
    # XFS mutations workflow runs both halves (#355).
    cmds:
      - scripts/test-xfs-mutations.sh {{.CLI_ARGS}}

  test:xfs-mutations-vm:
    desc: The Linux half of the XFS mutation oracle, in fs-linux-test-harness's VM — create|verify <dir>
    # The harness is a sibling at the tag SIBLING_PINS.txt names; the VM
    # comes down when the script exits.
    cmds:
      - scripts/xfs-mutations-vm.sh {{.CLI_ARGS}}

  check:agents-core:
    desc: AGENTS.md still carries the shared agent-core block, unmodified
    # A task naming a script and nothing else: rust-fs-core's, run in place
    # from the checkout beside this one. The same script runs inside the
    # Shell scripts job through scripts/tests/agents-core-check.sh, which also
    # proves it FAILS on a modified block, a missing marker and an absent file
    # -- a gate that cannot fail is indistinguishable from no gate.
    cmds:
      - bash ../rust-fs-core/scripts/agents-core-check.sh
      - bash ../rust-fs-core/scripts/changelog-check.sh
